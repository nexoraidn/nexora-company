# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Run security checks on pull requests targeting main
  pull_request:
    branches: ["main"]

  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  security:
    name: Security Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run NEXORA Security Check
        run: python3 scripts/security-check.py

  # Deploy only after Security Check passes
  deploy:
    needs: security
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Prepare public site
        run: |
          mkdir -p _site/assets
          cp index.html pay.html ai.html engine.html style.css ai.css engine.css script.js engine-interaction.js nexgo-logo.png nexora-ai.png nexora-brand.jpg nexora-pay.jpg _site/
          cp assets/nexora-engine-logo-v3.2.4.png _site/assets/
          printf '%s\n' 'nexoranx.com' > _site/CNAME
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
